name: Build and Test
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore
      run: dotnet restore PrintPilotProxy.sln
    - name: Build
      run: dotnet build PrintPilotProxy.sln --configuration Release --no-restore
    - name: Test
      run: dotnet test PrintPilotProxy.sln --configuration Release --no-build --verbosity normal
